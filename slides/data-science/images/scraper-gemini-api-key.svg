<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" font-family="'Helvetica Neue', Arial, 'PingFang TC', sans-serif">

  <!-- Drop shadow -->
  <rect x="14" y="14" width="334" height="364" rx="14" fill="#00000018"/>

  <!-- Browser window -->
  <rect x="10" y="10" width="334" height="364" rx="14" fill="white" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Chrome bar -->
  <rect x="10" y="10" width="334" height="38" rx="14" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="10" y="34" width="334" height="14" fill="#f0f0f0"/>

  <!-- Traffic lights -->
  <circle cx="28" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="29" r="6" fill="#27c93f"/>

  <!-- Address bar -->
  <rect x="82" y="19" width="210" height="20" rx="10" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <text x="187" y="34" text-anchor="middle" font-size="11" fill="#666">aistudio.google.com</text>

  <!-- AI Studio dark header -->
  <rect x="10" y="48" width="334" height="46" fill="#202124"/>

  <!-- Google G logo: four colored arcs -->
  <path d="M 30 58 A 13 13 0 0 1 43 71" stroke="#4285F4" stroke-width="5" fill="none" stroke-linecap="butt"/>
  <path d="M 43 71 A 13 13 0 0 1 30 84" stroke="#34A853" stroke-width="5" fill="none" stroke-linecap="butt"/>
  <path d="M 30 84 A 13 13 0 0 1 17 71" stroke="#FBBC04" stroke-width="5" fill="none" stroke-linecap="butt"/>
  <path d="M 17 71 A 13 13 0 0 1 30 58" stroke="#EA4335" stroke-width="5" fill="none" stroke-linecap="butt"/>
  <!-- G inner cover to form ring, plus horizontal bar -->
  <circle cx="30" cy="71" r="7" fill="#202124"/>
  <line x1="30" y1="71" x2="43" y2="71" stroke="#4285F4" stroke-width="5"/>
  <circle cx="30" cy="71" r="4" fill="#202124"/>

  <!-- AI Studio text -->
  <text x="52" y="67" font-size="13" fill="white" font-weight="bold">AI Studio</text>

  <!-- "Get API key" button (highlighted) -->
  <rect x="232" y="59" width="98" height="26" rx="13" fill="#4285F4"/>
  <text x="281" y="77" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Get API key</text>

  <!-- Content area background -->
  <rect x="10" y="94" width="334" height="280" fill="#f8f9fa"/>

  <!-- White content card -->
  <rect x="20" y="104" width="314" height="262" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Section title -->
  <text x="40" y="130" font-size="15" fill="#202124" font-weight="bold">API keys</text>

  <!-- Divider -->
  <line x1="30" y1="140" x2="324" y2="140" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Warning banner -->
  <rect x="30" y="150" width="284" height="28" rx="4" fill="#fef9e0" stroke="#f9ab00" stroke-width="1"/>
  <!-- Triangle warning icon -->
  <polygon points="44,172 50,160 56,172" fill="none" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="50" y="171" text-anchor="middle" font-size="8" fill="#e37400" font-weight="bold">!</text>
  <text x="182" y="169" text-anchor="middle" font-size="10" fill="#7b5800">請勿將 API 金鑰上傳至 GitHub 或外洩</text>

  <!-- API key row -->
  <rect x="30" y="190" width="248" height="38" rx="6" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
  <!-- Key icon: circle + shaft -->
  <circle cx="48" cy="209" r="6" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="54" y1="209" x2="64" y2="209" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="62" y1="209" x2="62" y2="214" stroke="#5f6368" stroke-width="1.5"/>
  <!-- Masked key text -->
  <text x="75" y="213" font-size="11" fill="#202124" font-family="'Courier New', monospace">AIzaSy••••••••••••</text>

  <!-- Copy button -->
  <rect x="284" y="192" width="36" height="34" rx="6" fill="#e8f0fe"/>
  <rect x="292" y="202" width="11" height="12" rx="2" fill="none" stroke="#1a73e8" stroke-width="1.5"/>
  <rect x="295" y="199" width="11" height="12" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>

  <!-- Create API key button -->
  <rect x="30" y="242" width="144" height="34" rx="6" fill="#1a73e8"/>
  <!-- Plus icon -->
  <line x1="46" y1="259" x2="56" y2="259" stroke="white" stroke-width="2"/>
  <line x1="51" y1="254" x2="51" y2="264" stroke="white" stroke-width="2"/>
  <text x="106" y="264" text-anchor="middle" font-size="12" fill="white" font-weight="bold">建立 API 金鑰</text>

  <!-- Divider -->
  <line x1="30" y1="292" x2="324" y2="292" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Footer note -->
  <text x="176" y="313" text-anchor="middle" font-size="11" fill="#888">建議存入</text>
  <!-- .env badge -->
  <rect x="201" y="301" width="36" height="18" rx="4" fill="#f1f3f4" stroke="#dadce0" stroke-width="1"/>
  <text x="219" y="314" text-anchor="middle" font-size="10" fill="#555" font-family="'Courier New', monospace">.env</text>
  <text x="252" y="313" font-size="11" fill="#888">檔案，勿寫死在程式碼</text>

  <!-- Callout annotation: arrow pointing to "Get API key" button -->
  <circle cx="214" cy="48" r="8" fill="#ff4444"/>
  <text x="214" y="52" text-anchor="middle" font-size="9" fill="white" font-weight="bold">1</text>
  <path d="M 222 50 L 232 62" stroke="#ff4444" stroke-width="1.5" fill="none"
        marker-end="url(#tip)"/>
  <defs>
    <marker id="tip" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#ff4444"/>
    </marker>
  </defs>

  <!-- Step 2 callout: API key field -->
  <circle cx="18" cy="209" r="8" fill="#ff4444"/>
  <text x="18" y="213" text-anchor="middle" font-size="9" fill="white" font-weight="bold">2</text>

  <!-- Step 3 callout: copy button -->
  <circle cx="320" cy="172" r="8" fill="#ff4444"/>
  <text x="320" y="176" text-anchor="middle" font-size="9" fill="white" font-weight="bold">3</text>
  <line x1="320" y1="180" x2="316" y2="191" stroke="#ff4444" stroke-width="1.2" stroke-dasharray="3,2"/>

</svg>
