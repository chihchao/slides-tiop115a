<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <!-- Slide background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Footer bar -->
  <rect x="0" y="510" width="960" height="30" fill="#f0f0f0"/>
  <text x="480" y="528" text-anchor="middle" font-size="11" fill="#888">課程名稱｜單元名稱</text>
  <text x="930" y="528" text-anchor="middle" font-size="11" fill="#888">10</text>

  <!-- Left column: text content -->
  <!-- Section title -->
  <text x="60" y="80" font-size="24" font-weight="bold" fill="#333">雙欄版型頁</text>
  <line x1="60" y1="92" x2="440" y2="92" stroke="#6699ff" stroke-width="2"/>

  <!-- Bullet items -->
  <circle cx="70" cy="135" r="5" fill="#6699ff"/>
  <text x="88" y="140" font-size="15" fill="#444">左側放置文字說明，右側放置圖片或示意圖</text>

  <circle cx="70" cy="180" r="5" fill="#6699ff"/>
  <text x="88" y="185" font-size="15" fill="#444">使用</text>
  <rect x="140" y="168" width="210" height="22" rx="3" fill="#f5f5f5" stroke="#ddd"/>
  <text x="145" y="184" font-size="13" fill="#c7254e" font-family="monospace">&lt;!-- _class: pattern --&gt;</text>
  <text x="360" y="185" font-size="15" fill="#444">觸發此版型</text>

  <circle cx="70" cy="225" r="5" fill="#6699ff"/>
  <text x="88" y="230" font-size="15" fill="#444">CSS Grid</text>
  <rect x="170" y="213" width="88" height="22" rx="3" fill="#f5f5f5" stroke="#ddd"/>
  <text x="175" y="229" font-size="13" fill="#c7254e" font-family="monospace">1fr 1fr</text>
  <text x="265" y="230" font-size="15" fill="#444">左右等寬分欄</text>

  <circle cx="70" cy="270" r="5" fill="#6699ff"/>
  <text x="88" y="275" font-size="15" fill="#444">文字內容必須包在</text>
  <rect x="245" y="258" width="60" height="22" rx="3" fill="#f5f5f5" stroke="#ddd"/>
  <text x="250" y="274" font-size="13" fill="#c7254e" font-family="monospace">&lt;div&gt;</text>
  <text x="312" y="275" font-size="15" fill="#444">標籤內</text>

  <circle cx="70" cy="315" r="5" fill="#6699ff"/>
  <text x="88" y="320" font-size="15" fill="#444">圖片自動套用圓角與陰影效果</text>

  <!-- Divider line between columns -->
  <line x1="490" y1="40" x2="490" y2="490" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right column: image placeholder with rounded corners and shadow -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <clipPath id="imgClip">
      <rect x="530" y="80" width="390" height="370" rx="12"/>
    </clipPath>
  </defs>

  <!-- Image area with shadow + rounded corners -->
  <rect x="530" y="80" width="390" height="370" rx="12" fill="#e8eef8" filter="url(#shadow)"/>

  <!-- Image placeholder content -->
  <!-- Landscape photo mockup: sky gradient -->
  <rect x="530" y="80" width="390" height="370" rx="12" fill="#c3cfe2" clip-path="url(#imgClip)"/>
  <rect x="530" y="80" width="390" height="185" rx="0" fill="#b8d0e8" clip-path="url(#imgClip)"/>
  <!-- Mountains silhouette -->
  <polygon points="530,265 600,180 670,230 740,160 820,220 920,175 920,265" fill="#7a9cbf" clip-path="url(#imgClip)"/>
  <!-- Ground -->
  <rect x="530" y="265" width="390" height="185" fill="#8fad8f" clip-path="url(#imgClip)"/>
  <!-- Sun -->
  <circle cx="820" cy="130" r="28" fill="#f7d98b" clip-path="url(#imgClip)"/>

  <!-- Image caption -->
  <text x="725" y="472" text-anchor="middle" font-size="13" fill="#888">雙欄示範圖</text>

  <!-- _class: pattern label badge -->
  <rect x="530" y="38" width="180" height="26" rx="13" fill="#6699ff" opacity="0.15"/>
  <text x="620" y="55" text-anchor="middle" font-size="12" fill="#3366cc" font-family="monospace">_class: pattern</text>

  <!-- Grid indicator arrows (subtle) -->
  <text x="270" y="490" text-anchor="middle" font-size="12" fill="#aaa">← 1fr (文字) →</text>
  <text x="725" y="490" text-anchor="middle" font-size="12" fill="#aaa">← 1fr (圖片) →</text>
</svg>
